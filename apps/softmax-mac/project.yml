name: Softmax
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    MACOSX_DEPLOYMENT_TARGET: '14.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  FaceMac:
    path: ../../surfaces/face-mac
  SoftmaxRuntime:
    path: Runtime
  SoftmaxAppSurface:
    path: Surface
  CogletSurfaceSDK:
    path: ../../sdk/surface-swift
targets:
  SoftmaxCore:
    type: framework
    platform: macOS
    sources: [Sources/SoftmaxCore]
    dependencies:
      - package: FaceMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softmax.app.core
        GENERATE_INFOPLIST_FILE: YES
  SoftmaxApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/SoftmaxApp
      - path: Design/DesignTokens.swift
      - path: Surface/catalog.v1.json
        buildPhase: resources
    dependencies:
      - target: SoftmaxCore
      - package: FaceMac
      - package: Sparkle
      - package: SoftmaxRuntime
      - package: SoftmaxAppSurface
      - package: CogletSurfaceSDK
        product: CogletSurface
    postBuildScripts:
      - name: Bundle universal hub transport
        script: bash "$SRCROOT/scripts/build-hub-helper.sh" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/softmax-hub-link"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/softmax-hub-link
    settings:
      base:
        PRODUCT_NAME: Softmax
        PRODUCT_BUNDLE_IDENTIFIER: com.softmax.app
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks'
  SoftmaxCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/SoftmaxCoreTests]
    dependencies:
      - target: SoftmaxCore
      - package: FaceMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softmax.app.core-tests
        GENERATE_INFOPLIST_FILE: YES
  SoftmaxUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/SoftmaxUITests]
    dependencies:
      - target: SoftmaxApp
      - package: CogletSurfaceSDK
        product: CogletTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softmax.app.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SoftmaxApp
schemes:
  Softmax:
    build:
      targets:
        SoftmaxApp: all
        SoftmaxCoreTests: [test]
        SoftmaxUITests: [test]
    test:
      targets:
        - SoftmaxCoreTests
        - SoftmaxUITests
      gatherCoverageData: true
      environmentVariables:
        SOFTMAX_APP_MOCK_PEER: $(SRCROOT)/../../target/debug/examples/app_surface_peer
