<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="762" viewBox="0 0 1040 762" role="img" aria-label="A cogent has no centre: every runtime it uses, on a laptop, a robot, a phone, in the Softmax Universe and on a Softmax-hosted runtime, runs a hub (a router and an optimizer), and the hubs&#x27; routers peer. Devices run Face and the coglets for their apps; the hosted runtime runs the factory, memory and a database. The cogent is present on Face and Blender on the laptop; the rest run on their own.">
