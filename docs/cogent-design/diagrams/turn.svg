<line x1="301" y1="706" x2="104" y2="706" class="dg-warm" stroke-width="1.6" marker-end="url(#turn-warm)"/>
<circle cx="287" cy="706" r="8" class="dg-num"/>
<text x="287" y="709.5" text-anchor="middle" class="dg-numt">14</text>
<text x="193.5" y="698" text-anchor="middle" class="dg-code dg-halo">tell the user</text>
</svg>
