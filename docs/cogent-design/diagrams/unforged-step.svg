<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="A step is a merge: the coglet&#x27;s state (ours) and one input (theirs) go through a resolver that pins the engine, and the result is the next state commit. The same three ids key a cache.">
<style>
.dg-bg{fill:#fffdf8;stroke:#e2dccd}
.dg-group{fill:#f3efe4}
.dg-t{font:12px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-b{font:600 13px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-m{font:11px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558}
.dg-cap{font:600 10px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558;letter-spacing:.08em}
.dg-code{font:11px 'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;fill:#1d1b16}
.dg-halo{paint-order:stroke;stroke:#fffdf8;stroke-width:5px;stroke-linejoin:round}
.dg-coglet{fill:#d9ece9;stroke:#0b6e69}
.dg-adapter{fill:#f8e6d6;stroke:#a4531c}
.dg-runtime{fill:#fffdf8;stroke:#8a8474}
.dg-hub{fill:#dfe9f5;stroke:#1f4e8c}
.dg-world{fill:none;stroke:#8a8474;stroke-dasharray:4 4}
.dg-life{stroke:#c9c2b0;stroke-dasharray:3 4}
.dg-ink{stroke:#3a372f;fill:none}.dg-ink-h{fill:#3a372f}
.dg-teal{stroke:#0b6e69;fill:none}.dg-teal-h{fill:#0b6e69}
.dg-warm{stroke:#a4531c;fill:none}.dg-warm-h{fill:#a4531c}
.dg-blue{stroke:#1f4e8c;fill:none}.dg-blue-h{fill:#1f4e8c}
.dg-dash{stroke-dasharray:6 4}
.dg-num{fill:#1d1b16}.dg-numt{font:600 10px 'Avenir Next',system-ui,sans-serif;fill:#fffdf8}
.dg-e-basic{fill:#f6e7c1;stroke:#a87b12}.dg-e-wasm{fill:#e6dff5;stroke:#6a4bb0}.dg-e-js{fill:#e3efc8;stroke:#5d7a1c}
.dg-e-java{fill:#f6d9d6;stroke:#b0463c}.dg-e-llm{fill:#d3ecf0;stroke:#19788a}
@media (prefers-color-scheme: dark){
.dg-bg{fill:#1b1e24;stroke:#2c3038}
.dg-group{fill:#22262d}
.dg-t,.dg-b,.dg-code{fill:#e9e6df}
.dg-m,.dg-cap{fill:#9a968c}
.dg-halo{stroke:#1b1e24}
.dg-coglet{fill:#17302f;stroke:#5cc8bf}
.dg-adapter{fill:#3a2616;stroke:#e8a06a}
.dg-runtime{fill:#1b1e24;stroke:#7d796f}
.dg-hub{fill:#1c2b40;stroke:#8fb8f0}
.dg-world{stroke:#7d796f}
.dg-life{stroke:#3a3f48}
.dg-ink{stroke:#c9c5bb}.dg-ink-h{fill:#c9c5bb}
.dg-teal{stroke:#5cc8bf}.dg-teal-h{fill:#5cc8bf}
.dg-warm{stroke:#e8a06a}.dg-warm-h{fill:#e8a06a}
.dg-blue{stroke:#8fb8f0}.dg-blue-h{fill:#8fb8f0}
.dg-num{fill:#e9e6df}.dg-numt{fill:#1b1e24}
.dg-e-basic{fill:#3a2f14;stroke:#ecc56b}.dg-e-wasm{fill:#2b2440;stroke:#c3a2e8}.dg-e-js{fill:#26331a;stroke:#b9c97a}
.dg-e-java{fill:#3d1f1d;stroke:#f0958a}.dg-e-llm{fill:#14323a;stroke:#6fd0e0}
}
</style>
<defs><marker id="unforged-step-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-ink-h"/></marker><marker id="unforged-step-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-ink-h"/></marker><marker id="unforged-step-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-teal-h"/></marker><marker id="unforged-step-teal-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-teal-h"/></marker><marker id="unforged-step-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-warm-h"/></marker><marker id="unforged-step-warm-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-warm-h"/></marker><marker id="unforged-step-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-blue-h"/></marker><marker id="unforged-step-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-blue-h"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="379" rx="12" class="dg-bg"/>
<text x="30" y="40" text-anchor="start" class="dg-cap">ONE STEP, AS A MERGE</text>
<rect x="30" y="64" width="220" height="64" rx="8" class="dg-coglet"/>
<text x="140.0" y="93.0" text-anchor="middle" class="dg-b">state @ step n</text>
<text x="140.0" y="109.0" text-anchor="middle" class="dg-m">ours: code, data, logs</text>
<rect x="30" y="176" width="220" height="76" rx="8" class="dg-runtime"/>
<text x="140.0" y="211.0" text-anchor="middle" class="dg-b">input n</text>
<text x="140.0" y="227.0" text-anchor="middle" class="dg-m">theirs: events, time, seed,</text>
<text x="140" y="240" text-anchor="middle" class="dg-m">grants, boundary, model replies</text>
<rect x="330" y="112" width="220" height="84" rx="8" class="dg-hub"/>
<text x="440.0" y="151.0" text-anchor="middle" class="dg-b">resolver</text>
<text x="440.0" y="167.0" text-anchor="middle" class="dg-m">pins the engine build by id</text>
<text x="440" y="186" text-anchor="middle" class="dg-code">coglet-engine-wamr @ &lt;oid&gt;</text>
<path d="M252 96H290V140H328" class="dg-teal" stroke-width="1.6" marker-end="url(#unforged-step-teal)"/>
<path d="M252 214H290V170H328" class="dg-ink" stroke-width="1.6" marker-end="url(#unforged-step-ink)"/>
<rect x="630" y="112" width="300" height="84" rx="8" class="dg-coglet"/>
<text x="780.0" y="151.0" text-anchor="middle" class="dg-b">state @ step n+1</text>
<text x="780.0" y="167.0" text-anchor="middle" class="dg-m">parents: state n, input n</text>
<line x1="552" y1="154" x2="628" y2="154" class="dg-teal" stroke-width="1.6" marker-end="url(#unforged-step-teal)"/>
<text x="590" y="146" text-anchor="middle" class="dg-code">handle()</text>
<rect x="330" y="236" width="220" height="64" rx="8" class="dg-group"/>
<text x="440" y="260" text-anchor="middle" class="dg-b">cache key</text>
<text x="440" y="280" text-anchor="middle" class="dg-code">(resolver, state tree, input tree)</text>
<path d="M440 234V200" class="dg-teal dg-dash" stroke-width="1.6" marker-end="url(#unforged-step-teal)"/>
<rect x="700" y="250" width="160" height="44" rx="8" class="dg-adapter"/>
<text x="780.0" y="276.0" text-anchor="middle" class="dg-b">Adapter, LLM, router</text>
<line x1="780" y1="198" x2="780" y2="248" class="dg-warm" stroke-width="1.6" marker-end="url(#unforged-step-warm)"/>
<text x="790" y="226" text-anchor="start" class="dg-m">out/ is sent after the ref CAS</text>
<text x="30" y="340" text-anchor="start" class="dg-m">A nonzero return keeps nothing: the new commit carries the old tree and an empty out/.</text>
<text x="30" y="358" text-anchor="start" class="dg-m">The cache is only used when the resolver says the engine is qualified as deterministic.</text>
</svg>
