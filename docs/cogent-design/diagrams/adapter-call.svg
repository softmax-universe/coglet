<svg xmlns="http://www.w3.org/2000/svg" width="960" height="564" viewBox="0 0 960 564" role="img" aria-label="Calling an adapter from a coglet. The step only stages a file; after the step commits, the dispatcher sends it, and the outcome comes back through the next input commit, so replays read it instead of calling again.">
<style>
.dg-bg{fill:#fffdf8;stroke:#e2dccd}
.dg-group{fill:#f3efe4}
.dg-t{font:12px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-b{font:600 13px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-m{font:11px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558}
.dg-cap{font:600 10px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558;letter-spacing:.08em}
.dg-code{font:11px 'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;fill:#1d1b16}
.dg-halo{paint-order:stroke;stroke:#fffdf8;stroke-width:5px;stroke-linejoin:round}
.dg-coglet{fill:#d9ece9;stroke:#0b6e69}
.dg-adapter{fill:#f8e6d6;stroke:#a4531c}
.dg-runtime{fill:#fffdf8;stroke:#8a8474}
.dg-hub{fill:#dfe9f5;stroke:#1f4e8c}
.dg-world{fill:none;stroke:#8a8474;stroke-dasharray:4 4}
.dg-life{stroke:#c9c2b0;stroke-dasharray:3 4}
.dg-ink{stroke:#3a372f;fill:none}.dg-ink-h{fill:#3a372f}
.dg-teal{stroke:#0b6e69;fill:none}.dg-teal-h{fill:#0b6e69}
.dg-warm{stroke:#a4531c;fill:none}.dg-warm-h{fill:#a4531c}
.dg-blue{stroke:#1f4e8c;fill:none}.dg-blue-h{fill:#1f4e8c}
.dg-dash{stroke-dasharray:6 4}
.dg-num{fill:#1d1b16}.dg-numt{font:600 10px 'Avenir Next',system-ui,sans-serif;fill:#fffdf8}
.dg-e-basic{fill:#f6e7c1;stroke:#a87b12}.dg-e-wasm{fill:#e6dff5;stroke:#6a4bb0}.dg-e-js{fill:#e3efc8;stroke:#5d7a1c}
.dg-e-java{fill:#f6d9d6;stroke:#b0463c}.dg-e-llm{fill:#d3ecf0;stroke:#19788a}
@media (prefers-color-scheme: dark){
.dg-bg{fill:#1b1e24;stroke:#2c3038}
.dg-group{fill:#22262d}
.dg-t,.dg-b,.dg-code{fill:#e9e6df}
.dg-m,.dg-cap{fill:#9a968c}
.dg-halo{stroke:#1b1e24}
.dg-coglet{fill:#17302f;stroke:#5cc8bf}
.dg-adapter{fill:#3a2616;stroke:#e8a06a}
.dg-runtime{fill:#1b1e24;stroke:#7d796f}
.dg-hub{fill:#1c2b40;stroke:#8fb8f0}
.dg-world{stroke:#7d796f}
.dg-life{stroke:#3a3f48}
.dg-ink{stroke:#c9c5bb}.dg-ink-h{fill:#c9c5bb}
.dg-teal{stroke:#5cc8bf}.dg-teal-h{fill:#5cc8bf}
.dg-warm{stroke:#e8a06a}.dg-warm-h{fill:#e8a06a}
.dg-blue{stroke:#8fb8f0}.dg-blue-h{fill:#8fb8f0}
.dg-num{fill:#e9e6df}.dg-numt{fill:#1b1e24}
.dg-e-basic{fill:#3a2f14;stroke:#ecc56b}.dg-e-wasm{fill:#2b2440;stroke:#c3a2e8}.dg-e-js{fill:#26331a;stroke:#b9c97a}
.dg-e-java{fill:#3d1f1d;stroke:#f0958a}.dg-e-llm{fill:#14323a;stroke:#6fd0e0}
}
</style>
<defs><marker id="adapter-call-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-ink-h"/></marker><marker id="adapter-call-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-ink-h"/></marker><marker id="adapter-call-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-teal-h"/></marker><marker id="adapter-call-teal-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-teal-h"/></marker><marker id="adapter-call-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-warm-h"/></marker><marker id="adapter-call-warm-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-warm-h"/></marker><marker id="adapter-call-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-blue-h"/></marker><marker id="adapter-call-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-blue-h"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="563" rx="12" class="dg-bg"/>
<line x1="100" y1="64" x2="100" y2="492" class="dg-life" stroke-width="1.4"/>
<rect x="32.0" y="24" width="136" height="40" rx="8" class="dg-coglet"/>
<text x="100.0" y="48.0" text-anchor="middle" class="dg-b">Coglet</text>
<line x1="330" y1="64" x2="330" y2="492" class="dg-life" stroke-width="1.4"/>
<rect x="262.0" y="24" width="136" height="40" rx="8" class="dg-runtime"/>
<text x="330.0" y="48.0" text-anchor="middle" class="dg-b">Runtime</text>
<line x1="560" y1="64" x2="560" y2="492" class="dg-life" stroke-width="1.4"/>
<rect x="492.0" y="24" width="136" height="40" rx="8" class="dg-runtime"/>
<text x="560.0" y="48.0" text-anchor="middle" class="dg-b">Dispatcher</text>
<line x1="790" y1="64" x2="790" y2="492" class="dg-life" stroke-width="1.4"/>
<rect x="722.0" y="24" width="136" height="40" rx="8" class="dg-adapter"/>
<text x="790.0" y="48.0" text-anchor="middle" class="dg-b">MCP adapter</text>
<line x1="104" y1="108" x2="326" y2="108" class="dg-ink" stroke-width="1.6" marker-end="url(#adapter-call-ink)"/>
<circle cx="118" cy="108" r="8" class="dg-num"/>
<text x="118" y="111.5" text-anchor="middle" class="dg-numt">1</text>
<text x="224.0" y="100" text-anchor="middle" class="dg-code dg-halo">write /net/github/create_issue/call</text>
<path d="M330 142h34v18h-27" class="dg-ink" stroke-width="1.6" marker-end="url(#adapter-call-ink)"/>
<circle cx="316" cy="151" r="8" class="dg-num"/>
<text x="316" y="154.5" text-anchor="middle" class="dg-numt">2</text>
<text x="374" y="155" text-anchor="start" class="dg-code dg-halo">stage out/actions/42, commit step</text>
<line x1="334" y1="200" x2="556" y2="200" class="dg-teal dg-dash" stroke-width="1.6" marker-end="url(#adapter-call-teal)"/>
<circle cx="348" cy="200" r="8" class="dg-num"/>
<text x="348" y="203.5" text-anchor="middle" class="dg-numt">3</text>
<text x="454.0" y="192" text-anchor="middle" class="dg-code dg-halo">state ref moved</text>
<path d="M560 234h34v18h-27" class="dg-ink" stroke-width="1.6" marker-end="url(#adapter-call-ink)"/>
<circle cx="546" cy="243" r="8" class="dg-num"/>
<text x="546" y="246.5" text-anchor="middle" class="dg-numt">4</text>
<text x="604" y="247" text-anchor="start" class="dg-code dg-halo">check grant, note 42 as sent</text>
<line x1="564" y1="292" x2="786" y2="292" class="dg-warm" stroke-width="1.6" marker-end="url(#adapter-call-warm)"/>
<circle cx="578" cy="292" r="8" class="dg-num"/>
<text x="578" y="295.5" text-anchor="middle" class="dg-numt">5</text>
<text x="684.0" y="284" text-anchor="middle" class="dg-code dg-halo">mcp.github.create_issue</text>
<rect x="60" y="314" width="770" height="30" rx="6" class="dg-group"/>
<text x="445.0" y="333" text-anchor="middle" class="dg-m">the adapter uses its leased token; the coglet never sees it</text>
<line x1="786" y1="384" x2="564" y2="384" class="dg-warm" stroke-width="1.6" marker-end="url(#adapter-call-warm)"/>
<circle cx="772" cy="384" r="8" class="dg-num"/>
<text x="772" y="387.5" text-anchor="middle" class="dg-numt">6</text>
<text x="666.0" y="376" text-anchor="middle" class="dg-code dg-halo">outcome: issue #7 (scrubbed)</text>
<line x1="556" y1="430" x2="334" y2="430" class="dg-teal dg-dash" stroke-width="1.6" marker-end="url(#adapter-call-teal)"/>
<circle cx="542" cy="430" r="8" class="dg-num"/>
<text x="542" y="433.5" text-anchor="middle" class="dg-numt">7</text>
<text x="436.0" y="422" text-anchor="middle" class="dg-code dg-halo">append to next input commit</text>
<line x1="326" y1="476" x2="104" y2="476" class="dg-blue" stroke-width="1.6" marker-end="url(#adapter-call-blue)"/>
<circle cx="312" cy="476" r="8" class="dg-num"/>
<text x="312" y="479.5" text-anchor="middle" class="dg-numt">8</text>
<text x="206.0" y="468" text-anchor="middle" class="dg-code dg-halo">next handle() reads the outcome</text>
<line x1="40" y1="538" x2="74" y2="538" class="dg-ink" stroke-width="1.6" marker-end="url(#adapter-call-ink)"/>
<text x="82" y="542" text-anchor="start" class="dg-m">local work</text>
<line x1="160" y1="538" x2="194" y2="538" class="dg-teal dg-dash" stroke-width="1.6" marker-end="url(#adapter-call-teal)"/>
<text x="202" y="542" text-anchor="start" class="dg-m">through git</text>
<line x1="286" y1="538" x2="320" y2="538" class="dg-warm" stroke-width="1.6" marker-end="url(#adapter-call-warm)"/>
<text x="328" y="542" text-anchor="start" class="dg-m">live call</text>
<line x1="400" y1="538" x2="434" y2="538" class="dg-blue" stroke-width="1.6" marker-end="url(#adapter-call-blue)"/>
<text x="442" y="542" text-anchor="start" class="dg-m">event</text>
</svg>
