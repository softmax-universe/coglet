<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="564" viewBox="0 0 1090 564" role="img" aria-label="A message between runtimes goes from the sender&#x27;s runtime to the router, which accepts it and delivers it to the receiver&#x27;s inbox.">
<style>
.dg-bg{fill:#fffdf8;stroke:#e2dccd}
.dg-group{fill:#f3efe4}
.dg-t{font:12px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-b{font:600 13px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-m{font:11px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558}
.dg-cap{font:600 10px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558;letter-spacing:.08em}
.dg-code{font:11px 'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;fill:#1d1b16}
.dg-halo{paint-order:stroke;stroke:#fffdf8;stroke-width:5px;stroke-linejoin:round}
.dg-coglet{fill:#d9ece9;stroke:#0b6e69}
.dg-adapter{fill:#f8e6d6;stroke:#a4531c}
.dg-runtime{fill:#fffdf8;stroke:#8a8474}
.dg-hub{fill:#dfe9f5;stroke:#1f4e8c}
.dg-world{fill:none;stroke:#8a8474;stroke-dasharray:4 4}
.dg-life{stroke:#c9c2b0;stroke-dasharray:3 4}
.dg-ink{stroke:#3a372f;fill:none}.dg-ink-h{fill:#3a372f}
.dg-teal{stroke:#0b6e69;fill:none}.dg-teal-h{fill:#0b6e69}
.dg-warm{stroke:#a4531c;fill:none}.dg-warm-h{fill:#a4531c}
.dg-blue{stroke:#1f4e8c;fill:none}.dg-blue-h{fill:#1f4e8c}
.dg-dash{stroke-dasharray:6 4}
.dg-present{fill:none;stroke:#b8860b;stroke-width:2.4}
.dg-num{fill:#1d1b16}.dg-numt{font:600 10px 'Avenir Next',system-ui,sans-serif;fill:#fffdf8}
.dg-e-basic{fill:#f6e7c1;stroke:#a87b12}.dg-e-wasm{fill:#e6dff5;stroke:#6a4bb0}.dg-e-js{fill:#e3efc8;stroke:#5d7a1c}
.dg-e-java{fill:#f6d9d6;stroke:#b0463c}.dg-e-llm{fill:#d3ecf0;stroke:#19788a}
@media (prefers-color-scheme: dark){
.dg-bg{fill:#1b1e24;stroke:#2c3038}
.dg-group{fill:#22262d}
.dg-t,.dg-b,.dg-code{fill:#e9e6df}
.dg-m,.dg-cap{fill:#9a968c}
.dg-halo{stroke:#1b1e24}
.dg-coglet{fill:#17302f;stroke:#5cc8bf}
.dg-adapter{fill:#3a2616;stroke:#e8a06a}
.dg-runtime{fill:#1b1e24;stroke:#7d796f}
.dg-hub{fill:#1c2b40;stroke:#8fb8f0}
.dg-world{stroke:#7d796f}
.dg-life{stroke:#3a3f48}
.dg-ink{stroke:#c9c5bb}.dg-ink-h{fill:#c9c5bb}
.dg-teal{stroke:#5cc8bf}.dg-teal-h{fill:#5cc8bf}
.dg-warm{stroke:#e8a06a}.dg-warm-h{fill:#e8a06a}
.dg-blue{stroke:#8fb8f0}.dg-blue-h{fill:#8fb8f0}
.dg-num{fill:#e9e6df}.dg-numt{fill:#1b1e24}
.dg-present{stroke:#e5ff00}
.dg-e-basic{fill:#3a2f14;stroke:#ecc56b}.dg-e-wasm{fill:#2b2440;stroke:#c3a2e8}.dg-e-js{fill:#26331a;stroke:#b9c97a}
.dg-e-java{fill:#3d1f1d;stroke:#f0958a}.dg-e-llm{fill:#14323a;stroke:#6fd0e0}
}
</style>
<defs><marker id="service-call-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-ink-h"/></marker><marker id="service-call-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-ink-h"/></marker><marker id="service-call-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-teal-h"/></marker><marker id="service-call-teal-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-teal-h"/></marker><marker id="service-call-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-warm-h"/></marker><marker id="service-call-warm-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-warm-h"/></marker><marker id="service-call-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-blue-h"/></marker><marker id="service-call-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-blue-h"/></marker></defs>
<rect x="0.5" y="0.5" width="1089" height="563" rx="12" class="dg-bg"/>
<line x1="100" y1="64" x2="100" y2="492" class="dg-life" stroke-width="1.4"/>
<rect x="32.0" y="24" width="136" height="40" rx="8" class="dg-coglet"/>
<text x="100.0" y="48.0" text-anchor="middle" class="dg-b">Sender coglet</text>
<line x1="305" y1="64" x2="305" y2="492" class="dg-life" stroke-width="1.4"/>
<rect x="237.0" y="24" width="136" height="40" rx="8" class="dg-runtime"/>
<text x="305.0" y="48.0" text-anchor="middle" class="dg-b">Sender&#x27;s runtime</text>
<line x1="510" y1="64" x2="510" y2="492" class="dg-life" stroke-width="1.4"/>
<rect x="442.0" y="24" width="136" height="40" rx="8" class="dg-hub"/>
<text x="510.0" y="48.0" text-anchor="middle" class="dg-b">Router</text>
<line x1="715" y1="64" x2="715" y2="492" class="dg-life" stroke-width="1.4"/>
<rect x="647.0" y="24" width="136" height="40" rx="8" class="dg-runtime"/>
<text x="715.0" y="48.0" text-anchor="middle" class="dg-b">Receiver&#x27;s runtime</text>
<line x1="920" y1="64" x2="920" y2="492" class="dg-life" stroke-width="1.4"/>
<rect x="852.0" y="24" width="136" height="40" rx="8" class="dg-coglet"/>
<text x="920.0" y="48.0" text-anchor="middle" class="dg-b">Receiver coglet</text>
<line x1="104" y1="108" x2="301" y2="108" class="dg-teal" stroke-width="1.6" marker-end="url(#service-call-teal)"/>
<circle cx="118" cy="108" r="8" class="dg-num"/>
<text x="118" y="111.5" text-anchor="middle" class="dg-numt">1</text>
<text x="211.5" y="100" text-anchor="middle" class="dg-code dg-halo">emit(Action)</text>
<path d="M305 142h34v18h-27" class="dg-ink" stroke-width="1.6" marker-end="url(#service-call-ink)"/>
<circle cx="291" cy="151" r="8" class="dg-num"/>
<text x="291" y="154.5" text-anchor="middle" class="dg-numt">2</text>
<text x="349" y="155" text-anchor="start" class="dg-code dg-halo">run succeeds</text>
<line x1="309" y1="200" x2="506" y2="200" class="dg-blue" stroke-width="1.6" marker-end="url(#service-call-blue)"/>
<circle cx="323" cy="200" r="8" class="dg-num"/>
<text x="323" y="203.5" text-anchor="middle" class="dg-numt">3</text>
<text x="416.5" y="192" text-anchor="middle" class="dg-code dg-halo">send(message)</text>
<path d="M510 234h34v18h-27" class="dg-blue" stroke-width="1.6" marker-end="url(#service-call-blue)"/>
<circle cx="496" cy="243" r="8" class="dg-num"/>
<text x="496" y="246.5" text-anchor="middle" class="dg-numt">4</text>
<text x="554" y="247" text-anchor="start" class="dg-code dg-halo">check grant, pick receiver</text>
<line x1="506" y1="292" x2="309" y2="292" class="dg-blue dg-dash" stroke-width="1.6" marker-end="url(#service-call-blue)"/>
<circle cx="492" cy="292" r="8" class="dg-num"/>
<text x="492" y="295.5" text-anchor="middle" class="dg-numt">5</text>
<text x="398.5" y="284" text-anchor="middle" class="dg-code dg-halo">Accept</text>
<line x1="301" y1="338" x2="104" y2="338" class="dg-teal dg-dash" stroke-width="1.6" marker-end="url(#service-call-teal)"/>
<circle cx="287" cy="338" r="8" class="dg-num"/>
<text x="287" y="341.5" text-anchor="middle" class="dg-numt">6</text>
<text x="193.5" y="330" text-anchor="middle" class="dg-code dg-halo">action.outcome succeeded</text>
<line x1="514" y1="384" x2="711" y2="384" class="dg-blue" stroke-width="1.6" marker-end="url(#service-call-blue)"/>
<circle cx="528" cy="384" r="8" class="dg-num"/>
<text x="528" y="387.5" text-anchor="middle" class="dg-numt">7</text>
<text x="621.5" y="376" text-anchor="middle" class="dg-code dg-halo">deliver(MessageDelivery)</text>
<line x1="719" y1="430" x2="916" y2="430" class="dg-teal" stroke-width="1.6" marker-end="url(#service-call-teal)"/>
<circle cx="733" cy="430" r="8" class="dg-num"/>
<text x="733" y="433.5" text-anchor="middle" class="dg-numt">8</text>
<text x="826.5" y="422" text-anchor="middle" class="dg-code dg-halo">wake: new inbox message</text>
<rect x="60" y="452" width="900" height="30" rx="6" class="dg-group"/>
<text x="510.0" y="471" text-anchor="middle" class="dg-m">An answer is a new message from the receiver back to the sender, with the same correlation_id.</text>
<line x1="40" y1="538" x2="74" y2="538" class="dg-teal" stroke-width="1.6" marker-end="url(#service-call-teal)"/>
<text x="82" y="542" text-anchor="start" class="dg-m">coglet and its runtime</text>
<line x1="232" y1="538" x2="266" y2="538" class="dg-blue" stroke-width="1.6" marker-end="url(#service-call-blue)"/>
<text x="274" y="542" text-anchor="start" class="dg-m">runtime and router</text>
<line x1="400" y1="538" x2="434" y2="538" class="dg-ink dg-dash" stroke-width="1.6" marker-end="url(#service-call-ink)"/>
<text x="442" y="542" text-anchor="start" class="dg-m">dashed = answer</text>
</svg>
