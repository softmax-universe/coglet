<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="What stays in cogletd and what moves to unforged. The runtime keeps what must be fast, local or metered; everything durable moves into git.">
<style>
.dg-bg{fill:#fffdf8;stroke:#e2dccd}
.dg-group{fill:#f3efe4}
.dg-t{font:12px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-b{font:600 13px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-m{font:11px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558}
.dg-cap{font:600 10px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558;letter-spacing:.08em}
.dg-code{font:11px 'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;fill:#1d1b16}
.dg-halo{paint-order:stroke;stroke:#fffdf8;stroke-width:5px;stroke-linejoin:round}
.dg-coglet{fill:#d9ece9;stroke:#0b6e69}
.dg-adapter{fill:#f8e6d6;stroke:#a4531c}
.dg-runtime{fill:#fffdf8;stroke:#8a8474}
.dg-hub{fill:#dfe9f5;stroke:#1f4e8c}
.dg-world{fill:none;stroke:#8a8474;stroke-dasharray:4 4}
.dg-life{stroke:#c9c2b0;stroke-dasharray:3 4}
.dg-ink{stroke:#3a372f;fill:none}.dg-ink-h{fill:#3a372f}
.dg-teal{stroke:#0b6e69;fill:none}.dg-teal-h{fill:#0b6e69}
.dg-warm{stroke:#a4531c;fill:none}.dg-warm-h{fill:#a4531c}
.dg-blue{stroke:#1f4e8c;fill:none}.dg-blue-h{fill:#1f4e8c}
.dg-dash{stroke-dasharray:6 4}
.dg-present{fill:none;stroke:#b8860b;stroke-width:2.4}
.dg-num{fill:#1d1b16}.dg-numt{font:600 10px 'Avenir Next',system-ui,sans-serif;fill:#fffdf8}
.dg-e-basic{fill:#f6e7c1;stroke:#a87b12}.dg-e-wasm{fill:#e6dff5;stroke:#6a4bb0}.dg-e-js{fill:#e3efc8;stroke:#5d7a1c}
.dg-e-java{fill:#f6d9d6;stroke:#b0463c}.dg-e-llm{fill:#d3ecf0;stroke:#19788a}
@media (prefers-color-scheme: dark){
.dg-bg{fill:#1b1e24;stroke:#2c3038}
.dg-group{fill:#22262d}
.dg-t,.dg-b,.dg-code{fill:#e9e6df}
.dg-m,.dg-cap{fill:#9a968c}
.dg-halo{stroke:#1b1e24}
.dg-coglet{fill:#17302f;stroke:#5cc8bf}
.dg-adapter{fill:#3a2616;stroke:#e8a06a}
.dg-runtime{fill:#1b1e24;stroke:#7d796f}
.dg-hub{fill:#1c2b40;stroke:#8fb8f0}
.dg-world{stroke:#7d796f}
.dg-life{stroke:#3a3f48}
.dg-ink{stroke:#c9c5bb}.dg-ink-h{fill:#c9c5bb}
.dg-teal{stroke:#5cc8bf}.dg-teal-h{fill:#5cc8bf}
.dg-warm{stroke:#e8a06a}.dg-warm-h{fill:#e8a06a}
.dg-blue{stroke:#8fb8f0}.dg-blue-h{fill:#8fb8f0}
.dg-num{fill:#e9e6df}.dg-numt{fill:#1b1e24}
.dg-present{stroke:#e5ff00}
.dg-e-basic{fill:#3a2f14;stroke:#ecc56b}.dg-e-wasm{fill:#2b2440;stroke:#c3a2e8}.dg-e-js{fill:#26331a;stroke:#b9c97a}
.dg-e-java{fill:#3d1f1d;stroke:#f0958a}.dg-e-llm{fill:#14323a;stroke:#6fd0e0}
}
</style>
<defs><marker id="runtime-split-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-ink-h"/></marker><marker id="runtime-split-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-ink-h"/></marker><marker id="runtime-split-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-teal-h"/></marker><marker id="runtime-split-teal-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-teal-h"/></marker><marker id="runtime-split-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-warm-h"/></marker><marker id="runtime-split-warm-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-warm-h"/></marker><marker id="runtime-split-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-blue-h"/></marker><marker id="runtime-split-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-blue-h"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="429" rx="12" class="dg-bg"/>
<rect x="24" y="24" width="440" height="380" rx="12" class="dg-group"/>
<text x="40" y="48" text-anchor="start" class="dg-cap">STAYS IN COGLETD</text>
<rect x="40" y="62" width="408" height="44" rx="8" class="dg-runtime"/>
<text x="56" y="81" text-anchor="start" class="dg-b">Wasm engine</text>
<text x="56" y="98" text-anchor="start" class="dg-m">WAMR, compute and deadline metering</text>
<rect x="40" y="116" width="408" height="44" rx="8" class="dg-runtime"/>
<text x="56" y="135" text-anchor="start" class="dg-b">Step loop</text>
<text x="56" y="152" text-anchor="start" class="dg-m">event batching, budgets, all-or-nothing</text>
<rect x="40" y="170" width="408" height="44" rx="8" class="dg-runtime"/>
<text x="56" y="189" text-anchor="start" class="dg-b">Grant checks</text>
<text x="56" y="206" text-anchor="start" class="dg-m">on every staged action</text>
<rect x="40" y="224" width="408" height="44" rx="8" class="dg-runtime"/>
<text x="56" y="243" text-anchor="start" class="dg-b">Dispatcher</text>
<text x="56" y="260" text-anchor="start" class="dg-m">live adapter connections, sends out/</text>
<rect x="40" y="278" width="408" height="44" rx="8" class="dg-runtime"/>
<text x="56" y="297" text-anchor="start" class="dg-b">Timers</text>
<text x="56" y="314" text-anchor="start" class="dg-m">firing needs a clock</text>
<rect x="40" y="332" width="408" height="44" rx="8" class="dg-runtime"/>
<text x="56" y="351" text-anchor="start" class="dg-b">Speech and barge-in</text>
<text x="56" y="368" text-anchor="start" class="dg-m">anything with a latency budget</text>
<rect x="496" y="24" width="440" height="380" rx="12" class="dg-group"/>
<text x="512" y="48" text-anchor="start" class="dg-cap">MOVES TO UNFORGED</text>
<rect x="512" y="62" width="408" height="44" rx="8" class="dg-hub"/>
<text x="528" y="81" text-anchor="start" class="dg-b">Snapshot, journal, WAL</text>
<text x="528" y="98" text-anchor="start" class="dg-m">commits on the state ref</text>
<rect x="512" y="116" width="408" height="44" rx="8" class="dg-hub"/>
<text x="528" y="135" text-anchor="start" class="dg-b">Crash recovery</text>
<text x="528" y="152" text-anchor="start" class="dg-m">read the ref: it is the last committed step</text>
<rect x="512" y="170" width="408" height="44" rx="8" class="dg-hub"/>
<text x="528" y="189" text-anchor="start" class="dg-b">Code updates, install, deploy</text>
<text x="528" y="206" text-anchor="start" class="dg-m">merges and ref moves</text>
<rect x="512" y="224" width="408" height="44" rx="8" class="dg-hub"/>
<text x="528" y="243" text-anchor="start" class="dg-b">Inbox, logs, effect ledger</text>
<text x="528" y="260" text-anchor="start" class="dg-m">input commits, files, a git note</text>
<rect x="512" y="278" width="408" height="44" rx="8" class="dg-hub"/>
<text x="528" y="297" text-anchor="start" class="dg-b">Manage reads and writes</text>
<text x="528" y="314" text-anchor="start" class="dg-m">git reads, boundary commits</text>
<rect x="512" y="332" width="408" height="44" rx="8" class="dg-hub"/>
<text x="528" y="351" text-anchor="start" class="dg-b">Replays, forks, gates</text>
<text x="528" y="368" text-anchor="start" class="dg-m">river exec jobs, cached</text>
</svg>
