<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="One journal, two runners. A device produces step commits in process; a Softmax-hosted runtime re-runs any of them as unforged jobs to replay, fork or test a candidate policy.">
<style>
.dg-bg{fill:#fffdf8;stroke:#e2dccd}
.dg-group{fill:#f3efe4}
.dg-t{font:12px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-b{font:600 13px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-m{font:11px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558}
.dg-cap{font:600 10px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558;letter-spacing:.08em}
.dg-code{font:11px 'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;fill:#1d1b16}
.dg-halo{paint-order:stroke;stroke:#fffdf8;stroke-width:5px;stroke-linejoin:round}
.dg-coglet{fill:#d9ece9;stroke:#0b6e69}
.dg-adapter{fill:#f8e6d6;stroke:#a4531c}
.dg-runtime{fill:#fffdf8;stroke:#8a8474}
.dg-hub{fill:#dfe9f5;stroke:#1f4e8c}
.dg-world{fill:none;stroke:#8a8474;stroke-dasharray:4 4}
.dg-life{stroke:#c9c2b0;stroke-dasharray:3 4}
.dg-ink{stroke:#3a372f;fill:none}.dg-ink-h{fill:#3a372f}
.dg-teal{stroke:#0b6e69;fill:none}.dg-teal-h{fill:#0b6e69}
.dg-warm{stroke:#a4531c;fill:none}.dg-warm-h{fill:#a4531c}
.dg-blue{stroke:#1f4e8c;fill:none}.dg-blue-h{fill:#1f4e8c}
.dg-dash{stroke-dasharray:6 4}
.dg-present{fill:none;stroke:#b8860b;stroke-width:2.4}
.dg-num{fill:#1d1b16}.dg-numt{font:600 10px 'Avenir Next',system-ui,sans-serif;fill:#fffdf8}
.dg-e-basic{fill:#f6e7c1;stroke:#a87b12}.dg-e-wasm{fill:#e6dff5;stroke:#6a4bb0}.dg-e-js{fill:#e3efc8;stroke:#5d7a1c}
.dg-e-java{fill:#f6d9d6;stroke:#b0463c}.dg-e-llm{fill:#d3ecf0;stroke:#19788a}
@media (prefers-color-scheme: dark){
.dg-bg{fill:#1b1e24;stroke:#2c3038}
.dg-group{fill:#22262d}
.dg-t,.dg-b,.dg-code{fill:#e9e6df}
.dg-m,.dg-cap{fill:#9a968c}
.dg-halo{stroke:#1b1e24}
.dg-coglet{fill:#17302f;stroke:#5cc8bf}
.dg-adapter{fill:#3a2616;stroke:#e8a06a}
.dg-runtime{fill:#1b1e24;stroke:#7d796f}
.dg-hub{fill:#1c2b40;stroke:#8fb8f0}
.dg-world{stroke:#7d796f}
.dg-life{stroke:#3a3f48}
.dg-ink{stroke:#c9c5bb}.dg-ink-h{fill:#c9c5bb}
.dg-teal{stroke:#5cc8bf}.dg-teal-h{fill:#5cc8bf}
.dg-warm{stroke:#e8a06a}.dg-warm-h{fill:#e8a06a}
.dg-blue{stroke:#8fb8f0}.dg-blue-h{fill:#8fb8f0}
.dg-num{fill:#e9e6df}.dg-numt{fill:#1b1e24}
.dg-present{stroke:#e5ff00}
.dg-e-basic{fill:#3a2f14;stroke:#ecc56b}.dg-e-wasm{fill:#2b2440;stroke:#c3a2e8}.dg-e-js{fill:#26331a;stroke:#b9c97a}
.dg-e-java{fill:#3d1f1d;stroke:#f0958a}.dg-e-llm{fill:#14323a;stroke:#6fd0e0}
}
</style>
<defs><marker id="unforged-replay-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-ink-h"/></marker><marker id="unforged-replay-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-ink-h"/></marker><marker id="unforged-replay-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-teal-h"/></marker><marker id="unforged-replay-teal-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-teal-h"/></marker><marker id="unforged-replay-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-warm-h"/></marker><marker id="unforged-replay-warm-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-warm-h"/></marker><marker id="unforged-replay-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-blue-h"/></marker><marker id="unforged-replay-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-blue-h"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="379" rx="12" class="dg-bg"/>
<text x="30" y="40" text-anchor="start" class="dg-cap">ONE JOURNAL, TWO RUNNERS</text>
<rect x="30" y="70" width="230" height="70" rx="8" class="dg-runtime"/>
<text x="145.0" y="102.0" text-anchor="middle" class="dg-b">cogletd on a device</text>
<text x="145.0" y="118.0" text-anchor="middle" class="dg-m">in process, no fork, no git binary</text>
<text x="145" y="160" text-anchor="middle" class="dg-m">writes step commits</text>
<rect x="300" y="82" width="60" height="44" rx="8" class="dg-coglet"/>
<text x="330.0" y="108.0" text-anchor="middle" class="dg-b">s37</text>
<rect x="374" y="82" width="60" height="44" rx="8" class="dg-coglet"/>
<text x="404.0" y="108.0" text-anchor="middle" class="dg-b">s38</text>
<line x1="372" y1="104" x2="362" y2="104" class="dg-ink" stroke-width="1.6" marker-end="url(#unforged-replay-ink)"/>
<rect x="448" y="82" width="60" height="44" rx="8" class="dg-coglet"/>
<text x="478.0" y="108.0" text-anchor="middle" class="dg-b">s39</text>
<line x1="446" y1="104" x2="436" y2="104" class="dg-ink" stroke-width="1.6" marker-end="url(#unforged-replay-ink)"/>
<rect x="522" y="82" width="60" height="44" rx="8" class="dg-coglet"/>
<text x="552.0" y="108.0" text-anchor="middle" class="dg-b">s40</text>
<line x1="520" y1="104" x2="510" y2="104" class="dg-ink" stroke-width="1.6" marker-end="url(#unforged-replay-ink)"/>
<rect x="596" y="82" width="60" height="44" rx="8" class="dg-coglet"/>
<text x="626.0" y="108.0" text-anchor="middle" class="dg-b">s41</text>
<line x1="594" y1="104" x2="584" y2="104" class="dg-ink" stroke-width="1.6" marker-end="url(#unforged-replay-ink)"/>
<line x1="262" y1="104" x2="298" y2="104" class="dg-teal" stroke-width="1.6" marker-end="url(#unforged-replay-teal)"/>
<text x="475" y="60" text-anchor="middle" class="dg-m">refs/coglets/&lt;id&gt;/state, pushed to the router</text>
<rect x="700" y="70" width="230" height="70" rx="8" class="dg-hub"/>
<text x="815.0" y="102.0" text-anchor="middle" class="dg-b">unforged on CAOS</text>
<text x="815.0" y="118.0" text-anchor="middle" class="dg-m">a job per step, cached</text>
<line x1="672" y1="104" x2="698" y2="104" class="dg-teal dg-dash" stroke-width="1.6" marker-end="url(#unforged-replay-teal)"/>
<rect x="300" y="190" width="630" height="42" rx="8" class="dg-group"/>
<text x="316" y="216" text-anchor="start" class="dg-b">Replay</text>
<text x="380" y="216" text-anchor="start" class="dg-m">same inputs, cache off: tree ids must match</text>
<rect x="300" y="242" width="630" height="42" rx="8" class="dg-group"/>
<text x="316" y="268" text-anchor="start" class="dg-b">Fork</text>
<text x="380" y="268" text-anchor="start" class="dg-m">same state, new input: a new branch</text>
<rect x="300" y="294" width="630" height="42" rx="8" class="dg-group"/>
<text x="316" y="320" text-anchor="start" class="dg-b">Gate</text>
<text x="380" y="320" text-anchor="start" class="dg-m">candidate policy over recorded inputs</text>
<path d="M815 142V172H615V188" class="dg-blue" stroke-width="1.6" marker-end="url(#unforged-replay-blue)"/>
<text x="30" y="220" text-anchor="start" class="dg-m">Each job leaves a receipt:</text>
<text x="30" y="240" text-anchor="start" class="dg-code">runner, worker image,</text>
<text x="30" y="257" text-anchor="start" class="dg-code">executed or cached,</text>
<text x="30" y="274" text-anchor="start" class="dg-code">which cache served it</text>
</svg>
