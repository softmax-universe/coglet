<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="The vault is two things: a policy repository in unforged that says which adapters may use which secret, and a key store that holds the bytes. An adapter leases a value for minutes; a coglet only ever names the secret&#x27;s id.">
<style>
.dg-bg{fill:#fffdf8;stroke:#e2dccd}
.dg-group{fill:#f3efe4}
.dg-t{font:12px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-b{font:600 13px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#1d1b16}
.dg-m{font:11px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558}
.dg-cap{font:600 10px 'Avenir Next','Segoe UI',system-ui,sans-serif;fill:#6b6558;letter-spacing:.08em}
.dg-code{font:11px 'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;fill:#1d1b16}
.dg-halo{paint-order:stroke;stroke:#fffdf8;stroke-width:5px;stroke-linejoin:round}
.dg-coglet{fill:#d9ece9;stroke:#0b6e69}
.dg-adapter{fill:#f8e6d6;stroke:#a4531c}
.dg-runtime{fill:#fffdf8;stroke:#8a8474}
.dg-hub{fill:#dfe9f5;stroke:#1f4e8c}
.dg-world{fill:none;stroke:#8a8474;stroke-dasharray:4 4}
.dg-life{stroke:#c9c2b0;stroke-dasharray:3 4}
.dg-ink{stroke:#3a372f;fill:none}.dg-ink-h{fill:#3a372f}
.dg-teal{stroke:#0b6e69;fill:none}.dg-teal-h{fill:#0b6e69}
.dg-warm{stroke:#a4531c;fill:none}.dg-warm-h{fill:#a4531c}
.dg-blue{stroke:#1f4e8c;fill:none}.dg-blue-h{fill:#1f4e8c}
.dg-dash{stroke-dasharray:6 4}
.dg-num{fill:#1d1b16}.dg-numt{font:600 10px 'Avenir Next',system-ui,sans-serif;fill:#fffdf8}
.dg-e-basic{fill:#f6e7c1;stroke:#a87b12}.dg-e-wasm{fill:#e6dff5;stroke:#6a4bb0}.dg-e-js{fill:#e3efc8;stroke:#5d7a1c}
.dg-e-java{fill:#f6d9d6;stroke:#b0463c}.dg-e-llm{fill:#d3ecf0;stroke:#19788a}
@media (prefers-color-scheme: dark){
.dg-bg{fill:#1b1e24;stroke:#2c3038}
.dg-group{fill:#22262d}
.dg-t,.dg-b,.dg-code{fill:#e9e6df}
.dg-m,.dg-cap{fill:#9a968c}
.dg-halo{stroke:#1b1e24}
.dg-coglet{fill:#17302f;stroke:#5cc8bf}
.dg-adapter{fill:#3a2616;stroke:#e8a06a}
.dg-runtime{fill:#1b1e24;stroke:#7d796f}
.dg-hub{fill:#1c2b40;stroke:#8fb8f0}
.dg-world{stroke:#7d796f}
.dg-life{stroke:#3a3f48}
.dg-ink{stroke:#c9c5bb}.dg-ink-h{fill:#c9c5bb}
.dg-teal{stroke:#5cc8bf}.dg-teal-h{fill:#5cc8bf}
.dg-warm{stroke:#e8a06a}.dg-warm-h{fill:#e8a06a}
.dg-blue{stroke:#8fb8f0}.dg-blue-h{fill:#8fb8f0}
.dg-num{fill:#e9e6df}.dg-numt{fill:#1b1e24}
.dg-e-basic{fill:#3a2f14;stroke:#ecc56b}.dg-e-wasm{fill:#2b2440;stroke:#c3a2e8}.dg-e-js{fill:#26331a;stroke:#b9c97a}
.dg-e-java{fill:#3d1f1d;stroke:#f0958a}.dg-e-llm{fill:#14323a;stroke:#6fd0e0}
}
</style>
<defs><marker id="secrets-lease-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-ink-h"/></marker><marker id="secrets-lease-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-ink-h"/></marker><marker id="secrets-lease-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-teal-h"/></marker><marker id="secrets-lease-teal-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-teal-h"/></marker><marker id="secrets-lease-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-warm-h"/></marker><marker id="secrets-lease-warm-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-warm-h"/></marker><marker id="secrets-lease-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-blue-h"/></marker><marker id="secrets-lease-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" class="dg-blue-h"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="449" rx="12" class="dg-bg"/>
<rect x="24" y="24" width="300" height="250" rx="12" class="dg-group"/>
<text x="40" y="48" text-anchor="start" class="dg-cap">POLICY, IN UNFORGED</text>
<rect x="40" y="62" width="268" height="196" rx="8" class="dg-hub"/>
<text x="54" y="84" text-anchor="start" class="dg-code">refs/vault/policy</text>
<rect x="54" y="96" width="240" height="36" rx="6" class="dg-runtime"/>
<text x="66" y="111" text-anchor="start" class="dg-code">github-main</text>
<text x="66" y="125" text-anchor="start" class="dg-m">owner, kind, store path</text>
<rect x="54" y="138" width="240" height="36" rx="6" class="dg-runtime"/>
<text x="66" y="153" text-anchor="start" class="dg-code">may lease</text>
<text x="66" y="167" text-anchor="start" class="dg-m">mcp.github, ci</text>
<rect x="54" y="180" width="240" height="36" rx="6" class="dg-runtime"/>
<text x="66" y="195" text-anchor="start" class="dg-code">state</text>
<text x="66" y="209" text-anchor="start" class="dg-m">active | rotating | revoked</text>
<text x="174" y="246" text-anchor="middle" class="dg-m">signed commits, no secret bytes</text>
<rect x="24" y="296" width="300" height="100" rx="12" class="dg-group"/>
<text x="40" y="320" text-anchor="start" class="dg-cap">BYTES, IN A KEY STORE</text>
<rect x="40" y="332" width="268" height="50" rx="8" class="dg-e-wasm"/>
<text x="174.0" y="361.0" text-anchor="middle" class="dg-b">cloud KMS, Vault, OS keychain</text>
<rect x="380" y="150" width="200" height="80" rx="8" class="dg-runtime"/>
<text x="480.0" y="187.0" text-anchor="middle" class="dg-b">lease service</text>
<text x="480.0" y="203.0" text-anchor="middle" class="dg-m">checks policy tip, issues lease</text>
<line x1="310" y1="160" x2="378" y2="176" class="dg-ink" stroke-width="1.6" marker-end="url(#secrets-lease-ink)"/>
<text x="344" y="154" text-anchor="middle" class="dg-m">reads</text>
<line x1="310" y1="356" x2="378" y2="216" class="dg-ink" stroke-width="1.6" marker-end="url(#secrets-lease-ink)"/>
<text x="330" y="300" text-anchor="start" class="dg-m">fetches</text>
<rect x="640" y="150" width="140" height="80" rx="8" class="dg-adapter"/>
<text x="710.0" y="187.0" text-anchor="middle" class="dg-b">MCP adapter</text>
<text x="710.0" y="203.0" text-anchor="middle" class="dg-m">value in memory</text>
<line x1="582" y1="190" x2="638" y2="190" class="dg-warm" stroke-width="1.6" marker-end="url(#secrets-lease-warm)"/>
<text x="610" y="182" text-anchor="middle" class="dg-m">lease</text>
<rect x="820" y="150" width="120" height="80" rx="8" class="dg-bg"/>
<text x="880.0" y="187.0" text-anchor="middle" class="dg-b">GitHub</text>
<text x="880.0" y="203.0" text-anchor="middle" class="dg-m">the real API</text>
<line x1="782" y1="190" x2="818" y2="190" class="dg-warm" stroke-width="1.6" marker-end="url(#secrets-lease-warm)" marker-start="url(#secrets-lease-warm-s)"/>
<rect x="640" y="300" width="140" height="64" rx="8" class="dg-coglet"/>
<text x="710.0" y="329.0" text-anchor="middle" class="dg-b">Coglet</text>
<text x="710.0" y="345.0" text-anchor="middle" class="dg-m">names github-main</text>
<line x1="710" y1="298" x2="710" y2="234" class="dg-teal dg-dash" stroke-width="1.6" marker-end="url(#secrets-lease-teal)"/>
<text x="720" y="270" text-anchor="start" class="dg-m">action with a secret id</text>
<text x="480" y="270" text-anchor="middle" class="dg-m">each lease appends to</text>
<text x="480" y="288" text-anchor="middle" class="dg-code">refs/vault/audit</text>
<text x="480" y="306" text-anchor="middle" class="dg-m">(who, which secret, until when)</text>
<text x="480" y="428" text-anchor="middle" class="dg-m">Rotate: put a new value in the store; new leases get it. Revoke: commit state revoked; the next lease fails.</text>
</svg>
