[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "coglet-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["coglet-surface", "coglet-gate"]

[tool.uv.sources]
coglet-gate = { path = "../crates/coglet-gate", editable = true }
coglet-surface = { path = "../sdk/surface-python", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["coglet_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
