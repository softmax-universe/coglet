name: WAMR platforms
on:
  pull_request:
    paths: ['spikes/wamr-platforms/**', 'crates/coglet-engine/**', 'crates/coglet-engine-wamr/**', 'crates/coglet-runtime/**', 'Cargo.lock', '.github/workflows/wamr-platforms.yml']
  push:
    branches: [main]
    paths: ['spikes/wamr-platforms/**', 'crates/coglet-engine/**', 'crates/coglet-engine-wamr/**', 'crates/coglet-runtime/**', 'Cargo.lock', '.github/workflows/wamr-platforms.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - name: Assert native arm64 host and install targets
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add aarch64-apple-ios x86_64-apple-darwin wasm32-wasip1
      - name: Build and test default engine/runtime (no ignored tests)
        run: |
          cargo build --locked -p coglet-engine-wamr -p coglet-runtime
          cargo test --locked -p coglet-engine-wamr -p coglet-runtime -- --test-threads=1
      - name: Build and test native WAMR runtime (C ABI start/stop and real Wasm)
        run: |
          cargo build --locked -p coglet-runtime --features native-engine
          cargo test --locked -p coglet-engine-wamr -p coglet-runtime --features coglet-runtime/native-engine -- --test-threads=1
          cargo test --locked -p coglet-engine-wamr --no-default-features --features aot
      - name: Cross-build x86_64 Darwin (not an execution claim)
        run: cargo build --locked -p coglet-engine-wamr -p coglet-runtime --features coglet-runtime/native-engine --target x86_64-apple-darwin
      - name: iOS interpreter archive and SDK link probe (not a device run)
        run: bash crates/coglet-runtime/tools/apple-link-probe.sh
  armv7-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user wabt time
      - run: rustup toolchain install 1.91.1 --profile minimal && rustup target add --toolchain 1.91.1 armv7-unknown-linux-gnueabihf
      - run: bash spikes/wamr-platforms/test-armv7.sh
      - name: Qualify real engine crate on ARMv7 QEMU (not native EO1 evidence)
        run: |
          rustup target add armv7-unknown-linux-gnueabihf
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER='qemu-arm -L /usr/arm-linux-gnueabihf' cargo test --locked -p coglet-engine-wamr --target armv7-unknown-linux-gnueabihf -- --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wamr-armv7-measurements
          path: spikes/wamr-platforms/results/
