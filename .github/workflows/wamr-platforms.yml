name: WAMR platforms
on:
  pull_request:
    paths: ['spikes/wamr-platforms/**', 'crates/coglet-engine/**', 'crates/coglet-engine-wamr/**', 'crates/coglet-proto/**', 'crates/coglet-runtime/**', 'Cargo.lock', 'scripts/build-ios-runtime-xcframework.sh', 'scripts/tests/test_ios_runtime.py', 'release/ios_framework.py', 'release/test_ios_framework.py', '.github/workflows/ios-runtime-release.yml', '.github/workflows/wamr-platforms.yml']
  push:
    branches: [main]
    paths: ['spikes/wamr-platforms/**', 'crates/coglet-engine/**', 'crates/coglet-engine-wamr/**', 'crates/coglet-proto/**', 'crates/coglet-runtime/**', 'Cargo.lock', 'scripts/build-ios-runtime-xcframework.sh', 'scripts/tests/test_ios_runtime.py', 'release/ios_framework.py', 'release/test_ios_framework.py', '.github/workflows/ios-runtime-release.yml', '.github/workflows/wamr-platforms.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # macOS runners are the scarcest CI resource (org-wide concurrency cap). A new
  # head on a PR cancels that PR's older run; pushes and dispatches never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apple:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - name: Assert native arm64 host and install targets
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add aarch64-apple-ios x86_64-apple-darwin wasm32-wasip1 wasm32-unknown-unknown
      - name: Check Darwin proto and prove validator refuses unsupported execution
        run: |
          cargo check --locked -p coglet-proto --target aarch64-apple-darwin
          cargo test --locked -p coglet-proto --test bundle_envelope unsupported_platform_refuses_validator_execution -- --exact
      - name: Build and test default engine/runtime (no ignored tests)
        run: |
          cargo build --locked -p coglet-engine-wamr -p coglet-runtime
          cargo test --locked -p coglet-engine-wamr -p coglet-runtime -- --test-threads=1
      - name: Build and test native WAMR runtime (C ABI start/stop and real Wasm)
        run: |
          cargo build --locked -p coglet-runtime --features native-engine
          cargo test --locked -p coglet-engine-wamr -p coglet-runtime --features coglet-runtime/native-engine -- --test-threads=1
          cargo test --locked -p coglet-engine-wamr --no-default-features --features aot
      - name: Compile production echo without ambient WASI imports
        run: |
          rustup target add wasm32-unknown-unknown
          CARGO_PROFILE_RELEASE_LTO=true CARGO_PROFILE_RELEASE_OPT_LEVEL=z cargo rustc --locked --manifest-path coglets/echo/Cargo.toml --lib --release --target wasm32-unknown-unknown -- -C strip=symbols -C link-arg=--max-memory=16777216
          cargo run --quiet --locked -p coglet-runtime --features native-engine --example qualify_apple_guest -- coglets/echo/target/wasm32-unknown-unknown/release/coglet_echo.wasm
      - name: Cross-build x86_64 Darwin (not an execution claim)
        run: cargo build --locked -p coglet-engine-wamr -p coglet-runtime --features coglet-runtime/native-engine --target x86_64-apple-darwin
      - name: iOS interpreter archive and SDK link probe (not a device run)
        run: bash crates/coglet-runtime/tools/apple-link-probe.sh
      - name: Release C ABI and socket production echo timer-wake smoke (no surface echo roundtrip)
        # The socket control barrier qualifies release latency, as in tests/m1/run.sh.
        # Default/native debug suites above still execute unchanged.
        run: COGLET_ECHO_SMOKE_WASM="$PWD/coglets/echo/target/wasm32-unknown-unknown/release/coglet_echo.wasm" cargo test --release --locked -p coglet-runtime --features echo-smoke --test native_operational -- --test-threads=1
  ios-runtime:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test iOS build admission (not native execution)
        run: python3 scripts/tests/test_ios_runtime.py
      - name: Install pinned header generator
        run: cargo install cbindgen --version 0.29.2 --locked
      - name: Build interpreter-only iOS device and arm64 simulator xcframework
        env:
          COGLET_IOS_XCFRAMEWORK_OUTPUT: ${{ runner.temp }}/ios-runtime
        run: bash scripts/build-ios-runtime-xcframework.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CogletRuntime-iOS-xcframework
          path: ${{ runner.temp }}/ios-runtime
          if-no-files-found: error
  armv7-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user wabt time
      - run: rustup toolchain install 1.91.1 --profile minimal && rustup target add --toolchain 1.91.1 armv7-unknown-linux-gnueabihf
      - run: bash spikes/wamr-platforms/test-armv7.sh
      - name: Qualify real engine crate on ARMv7 QEMU (not native EO1 evidence)
        run: |
          rustup target add armv7-unknown-linux-gnueabihf
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER='qemu-arm -L /usr/arm-linux-gnueabihf' cargo test --locked -p coglet-engine-wamr --target armv7-unknown-linux-gnueabihf -- --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wamr-armv7-measurements
          path: spikes/wamr-platforms/results/
