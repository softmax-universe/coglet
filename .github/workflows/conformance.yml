name: conformance
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  swift-codegen:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift emitter keyword and collision regressions
        run: python3 -m unittest discover -s codegen -p test_swift.py -v
      - name: Strict Swift codec and recursive schema fixtures
        run: swift test --package-path sdk/surface-swift
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Include spec-v0 so the ABI checker verifies the freeze ref offline.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      # rust-toolchain.toml pins 1.100.0 with rustfmt/clippy/wasm32-wasip1; let rustup
      # install it once (as rust.yml does). A second installer made rustup hit
      # "detected conflict: 'bin/cargo-clippy'" and fail the job before any build.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: spec/tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: sdk/surface-java/pom.xml
      - run: python3 -m pip install -r spec/tests/requirements.txt
      - name: Generated types are current
        run: codegen/run --check
      - name: Resolve Jackson before Python test collection
        # Maven Central transfer errors are transient, and Maven caches a failed lookup
        # in ~/.m2 for the rest of the job. Retry with -U (recheck) and pre-fetch plugins too.
        run: |
          for i in 1 2 3; do
            mvn --batch-mode --no-transfer-progress -U -f sdk/surface-java/pom.xml dependency:go-offline && exit 0
            echo "Maven resolve attempt $i failed; retrying"; sleep $((i * 15))
          done
          exit 1
      - name: Generator regression tests
        run: python3 -m unittest discover -s codegen -v
      - name: Generated validator agrees with CDDL and JSON Schema
        run: python3 codegen/cross_check.py
      - run: python3 -m unittest discover -s spec/tests -v
      - name: Build real engine conformance adapter
        run: cargo build --locked -p coglet-engine-wamr --example wamr-conformance
      - name: Build Wasmtime conformance adapter
        run: cargo build --locked -p coglet-engine-wasmtime --example wasmtime-conformance
      - name: Build cooperative native engine conformance adapter
        run: cargo build --locked -p coglet-mock --example mock-conformance
      - name: Build surface adapters
        run: cargo build --locked --release -p coglet-surface-rust -p coglet-mock --bins
      - run: python3 -m unittest discover -s conformance/tests -v
      - run: cargo fmt --manifest-path conformance/iroh-driver/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path conformance/iroh-driver/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path conformance/iroh-driver/Cargo.toml
      - name: Harness self-test
        run: conformance/run --self-test --junit target/conformance-self-test.xml
      - name: Surface SDK and mock regressions
        run: cargo test --locked -p coglet-surface-rust -p coglet-mock
      - name: Surface SDK and mock lint
        run: cargo clippy --locked -p coglet-surface-rust -p coglet-mock --all-targets -- -D warnings
      - name: Full frozen ABI and executable archive WAMR qualification
        run: python3 crates/coglet-runtime/tools/check-abi.py
      - name: Every registered implementation and claimed suite
        if: ${{ !cancelled() }}
        run: conformance/run --junit target/conformance-registered.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-junit
          path: |
            target/conformance-*.xml
            target/runtime-all-abi/*.xml
          if-no-files-found: warn
