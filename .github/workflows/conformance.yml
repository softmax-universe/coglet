name: conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r spec/tests/requirements.txt
      - run: python3 -m unittest discover -s spec/tests -v
      - run: python3 -m unittest discover -s conformance/tests -v
      - run: conformance/run
