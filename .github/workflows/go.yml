name: go
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/surface-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/surface-go/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -v ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Go emitter keyword and collision regressions
        working-directory: .
        run: python3 -m unittest discover -s codegen -p test_go.py -v
