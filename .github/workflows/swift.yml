name: swift
# Runs on the coglet Mac minis (self-hosted, label coglet-mac) only when something
# it tests changes. The Linux swift-codegen and apple-check jobs cover every PR.
on:
  push:
    branches: [main]
    paths: &swift_paths ['sdk/surface-swift/**', 'surfaces/face-mac/**', 'codegen/**', 'spec/**', 'conformance/**', 'crates/coglet-engine-wamr/**', 'scripts/build-ios-runtime-xcframework.sh', 'release/ios_framework.py', 'release/test_ios_framework.py', '.github/workflows/ios-runtime-release.yml', '.github/workflows/swift.yml']
  pull_request:
    paths: *swift_paths
permissions:
  contents: read
concurrency:
  # macOS runners are the scarcest CI resource (org-wide concurrency cap). A new
  # head on a PR cancels that PR's older run; pushes and dispatches never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  swift:
    runs-on: [self-hosted, macOS, coglet-mac]
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path sdk/surface-swift
      - run: swift test --package-path sdk/surface-swift
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv run --no-project --python 3.12 python conformance/run --registry sdk/surface-swift/conformance.toml --junit target/swift-surface.xml
      - name: Shared surface-0.2 cases against compiled Swift (real clock)
        run: |
          uv run --no-project --python 3.12 python -m unittest discover -s conformance/tests -p test_contract_profile.py -v
          uv run --no-project --python 3.12 python conformance/run --registry conformance/impls-surface02-swift.toml --contract-profile surface-0.2 --junit target/swift-surface02.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-surface-conformance
          path: |
            target/swift-surface.xml
            target/swift-surface02.xml
          if-no-files-found: error
      - run: swift test --package-path surfaces/face-mac
