name: swift
# Runs on the coglet Mac minis (self-hosted, label coglet-mac) only when something
# it tests changes. The Linux swift-codegen and apple-check jobs cover every PR.
on:
  push:
    branches: [main]
    paths: &swift_paths ['sdk/surface-swift/**', 'surfaces/face-mac/**', 'coglets/face/**', 'crates/coglet-runtime/tests/face_mac_adapter.rs', 'crates/coglet-runtime/tests/support/face_persisted.rs', 'codegen/**', 'spec/**', 'conformance/**', 'crates/coglet-engine-wamr/**', 'scripts/build-ios-runtime-xcframework.sh', 'release/ios_framework.py', 'release/test_ios_framework.py', '.github/workflows/ios-runtime-release.yml', '.github/workflows/swift.yml']
  pull_request:
    paths: *swift_paths
permissions:
  contents: read
concurrency:
  # macOS runners are the scarcest CI resource (org-wide concurrency cap). A new
  # head on a PR cancels that PR's older run; pushes and dispatches never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  swift:
    runs-on: [self-hosted, macOS, coglet-mac]
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path sdk/surface-swift
      - run: swift test --package-path sdk/surface-swift
      - uses: astral-sh/setup-uv@v5
      - run: conformance/run --registry sdk/surface-swift/conformance.toml --junit target/swift-surface.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-surface-conformance
          path: target/swift-surface.xml
      - run: swift test --package-path surfaces/face-mac
      - run: swift build --package-path surfaces/face-mac --target FaceMacEmbeddingExample
      - run: swift build --package-path surfaces/face-mac --product face-mac
      - name: Compiled Face adapter speech timelines (simulated media)
        working-directory: sim
        env:
          FACE_MAC_EXECUTABLE: ${{ github.workspace }}/surfaces/face-mac/.build/debug/face-mac
        run: uv run --locked --python 3.12 pytest -q tests/test_face_mac_executable.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Face adapter production-runtime WAL replay (simulated media)
        timeout-minutes: 5
        env:
          FACE_MAC_EXECUTABLE: ${{ github.workspace }}/surfaces/face-mac/.build/debug/face-mac
        run: cargo test --locked -p coglet-runtime --test face_mac_adapter -- --ignored
      - name: Face guest controller tests and bounded Wasm compilation
        working-directory: coglets/face
        run: |
          cargo test --locked
          cargo rustc --locked --release --target wasm32-wasip1 --lib -- -C link-arg=--max-memory=16777216
      - name: Persisted Face guest to compiled adapter and executable replay (simulated media)
        timeout-minutes: 15
        env:
          FACE_MAC_EXECUTABLE: ${{ github.workspace }}/surfaces/face-mac/.build/debug/face-mac
          COGLET_FACE_WASM: ${{ github.workspace }}/coglets/face/target/wasm32-wasip1/release/coglet_face.wasm
        run: |
          cargo run --locked -p coglet-runtime --features native-engine --example qualify_apple_guest -- "$COGLET_FACE_WASM"
          cargo test --release --locked -p coglet-runtime --features native-engine --test face_mac_adapter -- --ignored
      - name: Actual C ABI scheduled Face guest and heard replay (simulated media)
        timeout-minutes: 15
        env:
          COGLET_FACE_WASM: ${{ github.workspace }}/coglets/face/target/wasm32-wasip1/release/coglet_face.wasm
        run: |
          cargo build --release --locked -p coglet-runtime --features native-engine --lib
          cargo build --release --locked -p coglet-runtime --features native-engine --example face_embedded_fixture
          swift build --package-path surfaces/face-mac/Integration -Xlinker -L"$PWD/target/release"
          PROOF=$(mktemp -d "$RUNNER_TEMP/face-cabi.XXXXXX")
          target/release/examples/face_embedded_fixture prepare "$PROOF" "$COGLET_FACE_WASM"
          DYLD_LIBRARY_PATH="$PWD/target/release" surfaces/face-mac/Integration/.build/debug/FaceRuntimeProof "$PROOF"
          target/release/examples/face_embedded_fixture verify "$PROOF"
