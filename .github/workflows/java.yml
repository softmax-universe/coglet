name: java
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      bundle-mode:
        type: string
        default: normal
      bundle-release:
        type: string
        default: dependency-mirror-v1
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dependency-restore
        with:
          job: java
          mode: ${{ inputs.bundle-mode || 'normal' }}
          release: ${{ inputs.bundle-release || 'dependency-mirror-v1' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ inputs.bundle-mode != 'proof' && 'maven' || '' }}
          cache-dependency-path: |
            sdk/surface-java/pom.xml
            scripts/ci/resolve_maven.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Jackson before Python test collection
        # Normal/proof builds never fetch Central metadata; prepare may fill a miss.
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/resolve_maven.py ${{ inputs.bundle-mode == 'prepare' && '--prepare' || '' }}
      - name: Java emitter keyword and collision regressions (no skips)
        run: >-
          python3 codegen/required_tests.py
          test_java
          test_identifiers.IdentifierTests.test_java_helper_and_keyword_fields_roundtrip
      - name: Strict native codec and recursive golden/negative fixtures
        run: mvn --batch-mode --no-transfer-progress -f sdk/surface-java/pom.xml test
      - uses: ./.github/actions/dependency-capture
        if: inputs.bundle-mode == 'prepare'
        with:
          job: java
