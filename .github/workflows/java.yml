name: java
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: sdk/surface-java/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Java emitter keyword and collision regressions
        run: python3 -m unittest discover -s codegen -p test_java.py -v
      - name: Strict native codec and recursive golden/negative fixtures
        run: mvn --batch-mode --no-transfer-progress -f sdk/surface-java/pom.xml test
