name: dependency-mirror
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/pom.xml'
      - '**/requirements*.txt'
      - '**/Gemfile*'
      - rust-toolchain.toml
      - .github/workflows/**
      - .github/actions/dependency-*/**
      - scripts/ci/**
      - codegen/**
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/dependency-*/**
      - scripts/ci/**
permissions:
  contents: read
concurrency:
  group: dependency-mirror-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    # PR proofs restore a candidate release that an operator publishes by hand after
    # reviewing this run's prepare artifacts. Until it exists the proofs cannot pass,
    # so they are skipped instead of showing red on every PR. Rerun this workflow
    # after publishing the candidate to get the proofs.
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo exists=true >> "$GITHUB_OUTPUT"
          elif gh release view "dependency-candidate-$HEAD_SHA" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo exists=true >> "$GITHUB_OUTPUT"
          else
            echo "No dependency-candidate-$HEAD_SHA release yet: proof jobs skip. Publish it, then rerun."
            echo exists=false >> "$GITHUB_OUTPUT"
          fi
  prepare-java:
    uses: ./.github/workflows/java.yml
    with:
      bundle-mode: prepare
  prepare-rust:
    uses: ./.github/workflows/rust.yml
    with:
      bundle-mode: prepare
  prepare-conformance:
    uses: ./.github/workflows/conformance.yml
    with:
      bundle-mode: prepare
  publish:
    needs: [prepare-java, prepare-rust, prepare-conformance]
    # PR code NEVER receives publication credentials. For candidate proof before
    # merge, an operator validates/downloads this run's artifacts and publishes a
    # candidate-only release. Rerun failed proof jobs, without changing the head.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      # Deliberately no checkout, restored caches, or execution of source/artifacts.
      - uses: actions/download-artifact@v4
        with:
          pattern: dependency-*
          path: bundles
          merge-multiple: true
      - name: Publish immutable input-addressed assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          release=dependency-mirror-v1
          if ! gh release view "$release"; then
            gh release create "$release" --target "$SOURCE_SHA" --title 'CI dependency mirror v1' --notes 'Dependency-only bundles; input identities, SHA-256 digests and source provenance are in each JSON manifest.' --prerelease --latest=false
          fi
          gh release view "$release" --json assets --jq '.assets[].name' > existing.txt
          count=0
          for file in bundles/*; do
            name=$(basename "$file")
            [[ "$name" =~ ^(java|rust|conformance)-(maven|cargo|rustup|python|gems)-[a-f0-9]{64}\.(json|tar\.gz)$ ]] || exit 1
            [[ -f "$file" && ! -L "$file" ]] || exit 1
            # No --clobber: a failed refresh can never overwrite a known-good set.
            if ! grep -Fxq "$name" existing.txt; then
              gh release upload "$release" "$file"
            fi
            count=$((count+1))
          done
          test "$count" -gt 0
  proof-java:
    needs: [candidate, prepare-java, prepare-rust, prepare-conformance, publish]
    if: always() && needs.candidate.outputs.exists == 'true' && needs.prepare-java.result == 'success' && needs.prepare-rust.result == 'success' && needs.prepare-conformance.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'pull_request')
    uses: ./.github/workflows/java.yml
    with:
      bundle-mode: proof
      bundle-release: ${{ github.event_name == 'pull_request' && format('dependency-candidate-{0}', github.event.pull_request.head.sha) || 'dependency-mirror-v1' }}
  proof-rust:
    needs: [candidate, prepare-java, prepare-rust, prepare-conformance, publish]
    if: always() && needs.candidate.outputs.exists == 'true' && needs.prepare-java.result == 'success' && needs.prepare-rust.result == 'success' && needs.prepare-conformance.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'pull_request')
    uses: ./.github/workflows/rust.yml
    with:
      bundle-mode: proof
      bundle-release: ${{ github.event_name == 'pull_request' && format('dependency-candidate-{0}', github.event.pull_request.head.sha) || 'dependency-mirror-v1' }}
  proof-conformance:
    needs: [candidate, prepare-java, prepare-rust, prepare-conformance, publish]
    if: always() && needs.candidate.outputs.exists == 'true' && needs.prepare-java.result == 'success' && needs.prepare-rust.result == 'success' && needs.prepare-conformance.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'pull_request')
    uses: ./.github/workflows/conformance.yml
    with:
      bundle-mode: proof
      bundle-release: ${{ github.event_name == 'pull_request' && format('dependency-candidate-{0}', github.event.pull_request.head.sha) || 'dependency-mirror-v1' }}
