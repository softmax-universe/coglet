name: surface-readiness
# Not a required check and not run in the merge queue: its 150 stress iterations
# are a proof for surface-readiness changes, so they run when that code changes,
# nightly, and on demand.
on:
  pull_request:
    paths: &readiness_paths ['conformance/**', 'sdk/surface-swift/**', 'sdk/surface-python/**', 'sdk/surface-rust/**', 'crates/coglet-mock/**', 'crates/coglet-types/**', 'spec/fixtures/surface/**', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/surface-readiness.yml']
  push:
    branches: [main]
    paths: *readiness_paths
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swift-startup-budget:
    runs-on: [self-hosted, macOS, coglet-mac]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path sdk/surface-swift
      - uses: astral-sh/setup-uv@v5
      - name: Real Swift slow-start regression and counterfactual
        run: uv run --no-project --python 3.12 python sdk/surface-swift/test_readiness.py -v
      - name: Bounded readiness and unchanged response deadlines
        run: uv run --no-project --python 3.12 python -m unittest discover -s conformance/tests -p test_readiness.py -v
      - name: Python delayed negotiation and supervisor backlog regressions
        run: uv run --project sdk/surface-python --python 3.12 pytest sdk/surface-python/tests/test_reference_readiness.py -v
      - name: 20 consecutive full Python functional registries under CPU load
        run: uv run --project sdk/surface-python --python 3.12 python sdk/surface-python/tests/repeat_registry.py
      - name: 20 consecutive full Swift registry passes under CPU load
        run: uv run --no-project --python 3.12 python sdk/surface-swift/repeat_registry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-readiness-proof
          path: |
            target/swift-readiness/
            target/python-readiness/
          if-no-files-found: error
  startup-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install startup syscall probe
        run: sudo apt-get update -qq && sudo apt-get install -y strace
      - name: Build real release surface adapter
        run: cargo build --locked --release -p coglet-surface-rust --bin coglet-reference-surface
      - name: Readiness and unchanged-deadline regressions
        run: python3 -m unittest discover -s conformance/tests -p test_readiness.py -v
      - name: 50 normal surface iterations
        run: python3 conformance/repeat_surface.py --output target/readiness/normal
      - name: 50 slow-durability iterations without readiness (must reproduce)
        run: python3 conformance/repeat_surface.py --slow-startup --without-readiness --output target/readiness/before
      - name: 50 identical slow-durability iterations with readiness (must pass)
        run: python3 conformance/repeat_surface.py --slow-startup --output target/readiness/after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-readiness-proof
          path: target/readiness/
          if-no-files-found: error
