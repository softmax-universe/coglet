# DISPOSABLE DIAGNOSTIC BRANCH ONLY. NEVER MERGE OR CHERRY-PICK THIS FILE.
# This job measures radio presentation; it is NOT softmax-mac-gate or acceptance.
name: Softmax radio presentation measurement ONLY
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: softmax-radio-measure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  radio-measurement:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      SOFTMAX_RADIO_MEASUREMENT_DIR: ${{ github.workspace }}/radio-measurement
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source and native environment
        run: |
          mkdir -p radio-measurement
          git rev-parse HEAD > radio-measurement/head.txt
          git status --porcelain > radio-measurement/source-status.txt
          sw_vers > radio-measurement/os.txt
          xcodebuild -version > radio-measurement/xcode.txt
          swift --version > radio-measurement/swift.txt
      - name: Measure only paired original and actual native radios
        run: |
          set -o pipefail
          swift test --package-path apps/softmax-mac/Surface --filter 'RadioPresentationMeasurementTests/testButtonAXMaterializationOnly' 2>&1 | tee radio-measurement/test.log
      - name: Hash retained measurements
        if: always()
        run: |
          cd radio-measurement
          shasum -a 256 *.json *.png *.txt *.log > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Softmax-radio-measurement-only
          path: radio-measurement
          if-no-files-found: error
