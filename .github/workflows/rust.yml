name: rust
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      bundle-mode:
        type: string
        default: normal
      bundle-release:
        type: string
        default: dependency-mirror-v1
permissions:
  contents: read
jobs:
  transform-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the run's head, never a PR's synthetic merge checkout.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute native R3 component inventory without skips
        env:
          CARGO_BUILD_JOBS: 2
          COGLET_TRANSFORM_EVIDENCE_DIR: ${{ runner.temp }}/transform-proof
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          rustup show active-toolchain
          python3 crates/coglet-transform/tests/check_runner.py
          python3 crates/coglet-transform/check.py --native-leg
      - uses: actions/upload-artifact@v4
        with:
          name: transform-native-${{ matrix.arch }}-${{ inputs.bundle-mode || 'normal' }}
          path: ${{ runner.temp }}/transform-proof
          if-no-files-found: error
  rust:
    needs: transform-native
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Both native architecture legs are mandatory
        run: test '${{ needs.transform-native.result }}' = 'success'
      - uses: actions/checkout@v4
        with:
          # Qualify the run's head, never a PR's synthetic merge checkout.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/dependency-restore
        with:
          job: rust
          mode: ${{ inputs.bundle-mode || 'normal' }}
          release: ${{ inputs.bundle-release || 'dependency-mirror-v1' }}
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: transform-native-*-${{ inputs.bundle-mode || 'normal' }}
          path: ${{ runner.temp }}/transform-native-pair
      - name: R3 native cross-architecture aggregation (required)
        run: |
          echo "COGLET_TRANSFORM_NATIVE_PAIR=$RUNNER_TEMP/transform-native-pair" >>"$GITHUB_ENV"
          COGLET_TRANSFORM_NATIVE_PAIR="$RUNNER_TEMP/transform-native-pair" python3 crates/coglet-transform/check.py --aggregate-test
      - name: cargo test --workspace (quarantined tests skipped; see ci/quarantine.toml)
        run: scripts/ci/cargo-test --workspace --locked
      - name: Device lifecycle and ADR-0027 real-daemon restart admission
        env:
          RUST_TEST_THREADS: "1"
        run: scripts/ci/cargo-test --locked -p coglet-runtime --features native-engine --test device_lifecycle
      - name: AOT feature fails closed under ABI v0
        run: scripts/ci/cargo-test --locked -p coglet-engine-wamr --no-default-features --features aot
      - run: cargo build -p coglet-guest-rust --target wasm32-wasip1 --locked
      - name: Build reference guest modules
        run: bash sdk/guest-rust/build-guests.sh
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: ${{ inputs.bundle-mode != 'proof' }}
      - name: Duplex-audio simulator to runtime heard history and offline replay
        if: ${{ (inputs.bundle-mode || 'normal') == 'normal' }}
        run: |
          args=$(python3 scripts/ci/quarantine.py rust-args)
          extra=()
          if [ -n "$args" ]; then mapfile -t extra <<< "$args"; fi
          cargo test --locked -p coglet-runtime --test sim_duplex_heard -- --ignored "${extra[@]}"
      - name: Execute compiled guest ABI tests
        run: uv run --with-requirements sdk/guest-rust/tests/requirements.txt python3 sdk/guest-rust/tests/test_wasm.py -v
      - name: Factory opt-in DB guest slice (not runtime DB conformance)
        run: bash coglets/factory/check.sh
      - name: Execute reference ABI cases on mock and WAMR
        run: |
          python3 sdk/guest-rust/tests/build_reference_cases.py --check
          cargo build --locked -p coglet-guest-rust --example reference_conformance
          for engine in mock wamr; do
            conformance/run --quarantine ci/quarantine.toml --suite abi --peer-role guest-reference --impl "python3 conformance/engine/adapter.py target/debug/examples/reference_conformance $engine" --junit "target/reference-$engine.xml"
          done
          python3 sdk/guest-rust/tests/check_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: reference-coglets-wasm-${{ inputs.bundle-mode || 'normal' }}
          path: target/guests/wasm32-wasip1/release/coglet_*.wasm
          if-no-files-found: error
      - name: M1 compiled echo, Rust mock, real hub enrollment and offline replay
        run: |
          rustup target add wasm32-unknown-unknown
          bash tests/m1/run.sh
      - name: Sandbox worlds through cogletd and independent WAMR replay
        run: bash sim/check-native.sh
      - name: Visualizer native M2 replay, scrub and receipt forks in Chromium
        run: bash tools/visualizer/check-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visualizer-native-proof-${{ inputs.bundle-mode || 'normal' }}
          path: tools/visualizer/proof/native/
          if-no-files-found: error
      - name: Production runtime selected-profile peer qualification
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          cargo build --locked -p coglet-runtime --bin cogletd
          export COGLET_FIXTURE_COGLETD="$PWD/target/debug/cogletd"
          uv run --no-project --python 3.12 python crates/coglet-runtime/tools/test_profile_fixture_bridge.py
          uv run --no-project --python 3.12 python -m unittest discover -s conformance/tests -p test_expect_close.py -v
          uv run --no-project --python 3.12 python conformance/run --registry conformance/impls-surface02-runtime.toml --contract-profile surface-0.2 --junit target/runtime-surface02.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-surface02-${{ inputs.bundle-mode || 'normal' }}
          path: target/runtime-surface02.xml
          if-no-files-found: error
      - name: Check daemon version
        run: test "$(cargo run --quiet -p coglet-runtime --bin cogletd)" = 'cogletd 0.1.0'
      - uses: ./.github/actions/dependency-capture
        if: inputs.bundle-mode == 'prepare'
        with:
          job: rust
