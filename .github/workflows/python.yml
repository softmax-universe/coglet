name: python
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Surface SDK
        working-directory: sdk/surface-python
        run: uv run --locked pytest
      - name: Simulator
        working-directory: sim
        run: uv run --locked pytest
      # ADR-0035 intentionally breaks ABI identity/version. Test this checkout,
      # not immutable rc1 (which must reject the new conformance manifests).
      - uses: dtolnay/rust-toolchain@stable
      - name: Build current runtime for visualizer
        run: cargo build --locked -p coglet-runtime --bin cogletd
      - name: Headless live visualizer (current cogletd)
        working-directory: tools/visualizer
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium
          COGLETD="$PWD/../../target/debug/cogletd" VISUALIZER_PROOF_DIR="$PWD/proof" uv run pytest --junitxml=proof/visualizer.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visualizer-browser-proof
          path: tools/visualizer/proof
          if-no-files-found: warn
