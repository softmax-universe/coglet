name: python
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Surface SDK
        working-directory: sdk/surface-python
        run: uv run --locked pytest
      - name: Simulator
        working-directory: sim
        run: uv run --locked pytest
