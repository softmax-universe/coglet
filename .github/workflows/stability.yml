name: stability
# Non-required. Finds flaky tests before they eject merge-queue entries, and tracks
# the tests quarantined from the required checks (ci/quarantine.toml): repeated
# full conformance, repeated quarantined Rust tests, and quarantine expiry.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      settings-search:
        description: 'Run the opt-in Settings first-arrow diagnostic in UI-suite context (5 iterations)'
        type: boolean
        default: false
      repeats:
        description: 'iterations (1 or more; 0 or empty means 20)'
        type: number
        default: 20
  push:
    branches: [main]
    paths: ['ci/quarantine.toml', 'scripts/ci/quarantine.py', '.github/workflows/stability.yml']
permissions:
  contents: read
concurrency:
  group: stability
  cancel-in-progress: false
jobs:
  settings-search:
    # Diagnostic only. Repetition never runs in the required native lane.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.settings-search }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned header generator
        run: cargo install cbindgen --version 0.29.2 --locked
      - name: Build real universal runtime
        run: bash scripts/build-runtime-xcframework.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/softmax-mac
        run: xcodegen generate
      - name: Repeat UI-suite context without retry-on-failure
        working-directory: apps/softmax-mac
        run: >-
          xcodebuild test -project Softmax.xcodeproj -scheme Softmax
          -destination 'platform=macOS' -derivedDataPath build
          -resultBundlePath SettingsSearchStability.xcresult CODE_SIGNING_ALLOWED=NO
          -only-testing:SoftmaxUITests
          -test-iterations 5 -test-repetition-relaunch-enabled YES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Softmax-settings-search-stability
          path: apps/softmax-mac/SettingsSearchStability.xcresult
          if-no-files-found: warn
  scheduler-stall:
    # Deliberately non-required; execute the script directly, never Go's test cache.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/surface-go/go.mod
          cache: false
      - run: python3 -m pip install -r spec/tests/requirements.txt
      - name: Build real Go adapter
        working-directory: sdk/surface-go
        run: go build -o ../../target/stability-go-surface ./cmd/conformance
      - name: Scheduler-stall comparisons under owned CPU and scheduling load
        env:
          REPEATS: ${{ inputs.repeats || 20 }}
        run: python3 sdk/surface-go/stress_fixture_clock.py target/stability-go-surface --repeats "$REPEATS"
  quarantine-age:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Every quarantined test has an owner and is under 14 days old
        run: python3 scripts/ci/quarantine.py check --fail-expired
  conformance:
    uses: ./.github/workflows/conformance.yml
    with:
      # workflow_dispatch can preserve numeric inputs as strings; workflow_call
      # strictly validates the callee's number type before creating any jobs.
      stability-repeats: ${{ fromJSON(format('{0}', inputs.repeats || 20)) }}
  rust-quarantined:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Plain cargo (network allowed): this job is not required, so it skips the
      # offline dependency bundle that rust.yml restores.
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Every quarantined Rust id names a real test
        run: |
          args=$(python3 scripts/ci/quarantine.py rust-args)  # an invalid file fails the step here
          if [ -z "$args" ]; then
            echo "No quarantined Rust tests."
            exit 0
          fi
          cargo test --workspace --locked -- --list --format terse > "$RUNNER_TEMP/rust-tests.txt"
          python3 scripts/ci/quarantine.py rust-unmatched --listing "$RUNNER_TEMP/rust-tests.txt"
      - name: Quarantined Rust tests, repeated
        env:
          REPEATS: ${{ inputs.repeats || 20 }}
        run: |
          args=$(python3 scripts/ci/quarantine.py rust-args --only)
          if [ -z "$args" ]; then
            echo "No quarantined Rust tests."
            exit 0
          fi
          mapfile -t only <<< "$args"
          for iteration in $(seq 1 "$REPEATS"); do
            echo "::group::iteration $iteration"
            cargo test --workspace --locked -- --include-ignored "${only[@]}"
            echo "::endgroup::"
          done
