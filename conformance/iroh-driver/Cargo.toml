[package]
name = "iroh-driver"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this test adapter independent of product crates and the root workspace.
[workspace]

[dependencies]
anyhow = "1.0"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
