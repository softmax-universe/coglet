[[implementations]]
name = "surface-rust-reference"
suites = ["surface"]
peer_roles = ["runtime"]
transport = "stdio"
command = ["target/release/coglet-reference-surface", "--stdio"]
[implementations.fixtures.surface-base.env]
COGLET_FIXTURE_CONFIG = "spec/fixtures/surface/adapter-config.json"
[implementations.fixtures.kill-at-100ms.env]
COGLET_FIXTURE_KILL_AT_MS = "100"

