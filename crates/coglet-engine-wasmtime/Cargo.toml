[package]
name = "coglet-engine-wasmtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
coglet-engine = { path = "../coglet-engine" }
wasmtime = { version = "=51.0.0", default-features = false, features = ["std", "runtime", "cranelift"] }


[dev-dependencies]
coglet-fs = { path = "../coglet-fs" }
coglet-engine-wamr = { path = "../coglet-engine-wamr" }
wat = "1.245.1"
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
