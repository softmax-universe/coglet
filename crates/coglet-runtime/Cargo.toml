[package]
name = "coglet-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
native-engine = ["dep:coglet-engine", "dep:coglet-engine-wamr", "dep:wasmparser"]

[dependencies]
coglet-engine = { path = "../coglet-engine", optional = true }
coglet-engine-wamr = { path = "../coglet-engine-wamr", optional = true }
wasmparser = { version = "=0.245.1", optional = true }
libc = "0.2"
coglet-types = { path = "../coglet-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
wat = "1.245.1"

[[bin]]
name = "cogletd"
path = "src/main.rs"
