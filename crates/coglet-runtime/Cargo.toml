[package]
name = "coglet-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
libc = "0.2"
coglet-types = { path = "../coglet-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "cogletd"
path = "src/main.rs"
