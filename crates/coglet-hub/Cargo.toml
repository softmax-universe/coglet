[package]
name = "coglet-hub"
default-run = "coglet-hub"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
test-controls = ["coglet-proto/test-controls"]

[dependencies]
coglet-proto = { path = "../coglet-proto" }
# ADR-0031: existing implementation remains hub/0 until its separate migration.
coglet-types = { package = "coglet-types-hub0", path = "../coglet-types-hub0" }
# Filesystem ABI versions evolve independently from the frozen serving router.
coglet-types-current = { package = "coglet-types", path = "../coglet-types" }
coglet-engine = { path = "../coglet-engine" }
wat = "=1.263.0"
wasmparser = "=0.245.1"
tempfile = "3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
libc = "0.2"
nix = { version = "0.31", features = ["process", "signal", "resource"] }
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["net", "io-util", "io-std", "macros", "rt-multi-thread", "time", "sync", "signal"] }

[dev-dependencies]
coglet-mock = { path = "../coglet-mock" }
coglet-runtime = { path = "../coglet-runtime", features = ["native-engine"] }
tempfile = "3"
