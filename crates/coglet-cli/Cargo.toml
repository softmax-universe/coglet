[package]
name = "coglet-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "coglet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
coglet-runtime = { path = "../coglet-runtime", features = ["native-engine"] }
coglet-proto = { path = "../coglet-proto" }
# ADR-0031: existing implementation remains hub/0 until its separate migration.
coglet-types = { package = "coglet-types-hub0", path = "../coglet-types-hub0" }
libc = "0.2"
hex = "0.4"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wasm-encoder = { version = "0.245", features = ["wasmparser"] }
wasmparser = "=0.245.1"

[dev-dependencies]
coglet-hub = { path = "../coglet-hub" }
wat = "1.245.1"
