[package]
name = "coglet-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "coglet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
coglet-runtime = { path = "../coglet-runtime", features = ["native-engine"] }
coglet-proto = { path = "../coglet-proto" }
coglet-types = { path = "../coglet-types" }
libc = "0.2"
hex = "0.4"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wasm-encoder = { version = "0.245", features = ["wasmparser"] }
wasmparser = "=0.245.1"

[dev-dependencies]
coglet-hub = { path = "../coglet-hub" }
wat = "1.245.1"
