[package]
name = "coglet-mock"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
test-controls = ["coglet-hub/test-controls"]

[[example]]
name = "mock_hub_peer"
required-features = ["test-controls"]

[dependencies]
coglet-hub = { path = "../coglet-hub" }
coglet-proto = { path = "../coglet-proto" }
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["io-util", "io-std", "macros", "rt-multi-thread", "time", "sync", "signal"] }
tempfile = "3"
coglet-engine = { path = "../coglet-engine" }
coglet-llm = { path = "../coglet-llm" }
coglet-surface-rust = { path = "../../sdk/surface-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
coglet-types = { path = "../coglet-types" }
