[package]
name = "coglet-types"
version.workspace = true
edition.workspace = true
publish.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
regex = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Guest validation cannot seed randomized caches from forbidden WASI imports.
regex = { version = "1", default-features = false, features = ["unicode"] }

[dependencies]
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Fixture JSON must keep full integer precision (u64 overflow must be detectable).
serde_json = { version = "1", features = ["arbitrary_precision"] }
