[package]
name = "coglet-transform"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek = "2"
hex = "0.4"
sha2 = "0.10"
wasm-encoder = { version = "=0.245.1", features = ["wasmparser"] }
