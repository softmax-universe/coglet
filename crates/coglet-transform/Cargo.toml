[dev-dependencies]
coglet-engine = { path = "../coglet-engine" }
coglet-engine-wamr = { path = "../coglet-engine-wamr" }
coglet-engine-wasmtime = { path = "../coglet-engine-wasmtime" }
wat = "1.245.1"
