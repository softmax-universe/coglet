[package]
name = "coglet-transform"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
peer = [
    "dep:coglet-engine",
    "dep:coglet-engine-wamr",
    "dep:coglet-engine-wasmtime",
]

[dependencies]
ed25519-dalek = "2"
hex = "0.4"
sha2 = "0.10"
wasm-encoder = { version = "=0.245.1", features = ["wasmparser"] }
wasmparser = "=0.245.1"
coglet-engine = { path = "../coglet-engine", optional = true }
coglet-engine-wamr = { path = "../coglet-engine-wamr", optional = true }
coglet-engine-wasmtime = { path = "../coglet-engine-wasmtime", optional = true }

[dev-dependencies]
coglet-engine = { path = "../coglet-engine" }
coglet-engine-wamr = { path = "../coglet-engine-wamr" }
coglet-engine-wasmtime = { path = "../coglet-engine-wasmtime" }
wat = "1.245.1"

[[bin]]
name = "coglet-transform-peer"
path = "src/bin/peer.rs"
required-features = ["peer"]
