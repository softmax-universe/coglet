[package]
name = "coglet-factory-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
coglet-db = { path = "../../../crates/coglet-db" }
coglet-types = { path = "../../../crates/coglet-types" }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"] }
