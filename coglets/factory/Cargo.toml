[package]
name = "coglet-factory"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
coglet-guest-rust = { path = "../../sdk/guest-rust", features = ["database"] }
coglet-types = { path = "../../crates/coglet-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
coglet-llm = { path = "../../crates/coglet-llm" }
coglet-mock = { path = "../../crates/coglet-mock" }
rusqlite = { version = "0.38", features = ["bundled"] }

[workspace]
